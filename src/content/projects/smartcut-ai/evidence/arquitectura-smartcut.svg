<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="diag-title diag-desc">
  <title id="diag-title">Arquitectura técnica verificada de SmartCut AI</title>
  <desc id="diag-desc">Diagrama de arquitectura que diferencia el Frontend en HTML5, CSS3 y JavaScript ES6+ POO (incluyendo módulos operativos y demostraciones visuales sin IA ni persistencia de citas), la comunicación API REST sobre HTTP, el Backend en FastAPI con Python 3.12, JWT HS256 y SQLAlchemy 2.0 ORM, y la base de datos SQLite en volumen Docker.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2554dc" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0e7490" />
    </marker>
  </defs>

  <!-- Fondo general -->
  <rect width="1280" height="760" rx="18" fill="#f4f6fa" />

  <!-- Encabezado del diagrama -->
  <rect x="24" y="20" width="1232" height="78" rx="14" fill="#101827" />
  <text x="48" y="54" fill="#f8fafc" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="22" font-weight="700">SmartCut AI — Arquitectura Cliente-Servidor Verificada (Prototipo Académico)</text>
  <text x="48" y="80" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="14">20 endpoints expuestos en Backend FastAPI · 15 endpoints únicos consumidos por Frontend · Persistencia SQLite en volumen Docker</text>

  <!-- Leyenda superior derecha -->
  <rect x="926" y="34" width="148" height="24" rx="12" fill="#dcfce7" />
  <text x="1000" y="50" text-anchor="middle" fill="#14532d" font-family="Inter, sans-serif" font-size="12" font-weight="700">Módulo operativo</text>
  <rect x="1084" y="34" width="152" height="24" rx="12" fill="#fef3c7" />
  <text x="1160" y="50" text-anchor="middle" fill="#78350f" font-family="Inter, sans-serif" font-size="12" font-weight="700">Demostración visual</text>

  <!-- COLUMNA 1: FRONTEND -->
  <rect x="24" y="118" width="430" height="614" rx="14" fill="#ffffff" stroke="#b9c6dc" stroke-width="2" />
  <rect x="24" y="118" width="430" height="52" rx="14" fill="#182338" />
  <text x="44" y="148" fill="#74d4e5" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="16" font-weight="700">1. CAPA FRONTEND (Cliente Web Estático)</text>
  <text x="44" y="192" fill="#475569" font-family="JetBrains Mono, monospace" font-size="12">HTML5 · CSS3 · JS ES6+ POO (6 clases) · &lt;dialog&gt; · Tailwind CDN</text>

  <!-- Bloque Auth + Dashboard -->
  <rect x="44" y="210" width="390" height="92" rx="10" fill="#f8fafc" stroke="#86efac" stroke-width="2" />
  <rect x="316" y="220" width="106" height="20" rx="10" fill="#dcfce7" />
  <text x="369" y="234" text-anchor="middle" fill="#14532d" font-family="Inter, sans-serif" font-size="11" font-weight="700">OPERATIVO</text>
  <text x="58" y="238" fill="#0f172a" font-family="Inter, sans-serif" font-size="15" font-weight="700">AuthController + UIController</text>
  <text x="58" y="260" fill="#334155" font-family="Inter, sans-serif" font-size="12.5">Registro con auto-login, login OAuth2, restauración de</text>
  <text x="58" y="278" fill="#334155" font-family="Inter, sans-serif" font-size="12.5">sesión (/auth/verify), logout local y Dashboard (Promise.all).</text>

  <!-- Bloque CRUD -->
  <rect x="44" y="316" width="390" height="92" rx="10" fill="#f8fafc" stroke="#86efac" stroke-width="2" />
  <rect x="316" y="326" width="106" height="20" rx="10" fill="#dcfce7" />
  <text x="369" y="340" text-anchor="middle" fill="#14532d" font-family="Inter, sans-serif" font-size="11" font-weight="700">OPERATIVO</text>
  <text x="58" y="344" fill="#0f172a" font-family="Inter, sans-serif" font-size="15" font-weight="700">CrudModule + ToastController</text>
  <text x="58" y="366" fill="#334155" font-family="Inter, sans-serif" font-size="12.5">CRUD completo de Usuarios, Servicios y Productos con</text>
  <text x="58" y="384" fill="#334155" font-family="Inter, sans-serif" font-size="12.5">búsqueda local, escape HTML y modales nativos &lt;dialog&gt;.</text>

  <!-- Bloque ApiClient -->
  <rect x="44" y="422" width="390" height="84" rx="10" fill="#e0ecff" stroke="#2554dc" stroke-width="2" />
  <text x="58" y="448" fill="#1e3a8a" font-family="Inter, sans-serif" font-size="15" font-weight="700">ApiClient + ApiError (Único punto fetch)</text>
  <text x="58" y="470" fill="#1e293b" font-family="Inter, sans-serif" font-size="12.5">15 invocaciones this.api.* · Bearer JWT en localStorage</text>
  <text x="58" y="488" fill="#1e293b" font-family="Inter, sans-serif" font-size="12.5">Soporta x-www-form-urlencoded (login) y application/json.</text>

  <!-- Subgrupo Demostraciones Visuales -->
  <rect x="44" y="522" width="390" height="192" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" stroke-dasharray="6 4" />
  <text x="58" y="546" fill="#78350f" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Módulos de Demostración Visual (Alcance Acotado)</text>

  <rect x="58" y="558" width="362" height="66" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="70" y="580" fill="#0f172a" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Agendamiento (Demo parcial)</text>
  <text x="70" y="598" fill="#334155" font-family="Inter, sans-serif" font-size="12">Lee catálogo real vía GET /services/, pero la confirmación</text>
  <text x="70" y="614" fill="#78350f" font-family="Inter, sans-serif" font-size="12" font-weight="600">es simulada en cliente y NO persiste citas en SQLite.</text>

  <rect x="58" y="634" width="362" height="66" rx="8" fill="#ffffff" stroke="#fcd34d" />
  <text x="70" y="656" fill="#0f172a" font-family="Inter, sans-serif" font-size="13.5" font-weight="700">Simulador de Estilo (Solo cliente)</text>
  <text x="70" y="674" fill="#334155" font-family="Inter, sans-serif" font-size="12">Previsualización local (URL.createObjectURL &lt;= 10 MB).</text>
  <text x="70" y="690" fill="#78350f" font-family="Inter, sans-serif" font-size="12" font-weight="600">NO envía archivos al backend ni ejecuta modelos de IA.</text>

  <!-- CANAL CENTRAL: API REST HTTP -->
  <rect x="476" y="388" width="152" height="148" rx="12" fill="#ffffff" stroke="#2554dc" stroke-width="1.8" />
  <text x="552" y="416" text-anchor="middle" fill="#1e3a8a" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="700">API REST / HTTP</text>
  <text x="552" y="438" text-anchor="middle" fill="#334155" font-family="JetBrains Mono, monospace" font-size="11.5">JSON + OAuth2 Form</text>
  <text x="552" y="458" text-anchor="middle" fill="#334155" font-family="JetBrains Mono, monospace" font-size="11.5">Authorization:</text>
  <text x="552" y="475" text-anchor="middle" fill="#2554dc" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="600">Bearer &lt;JWT&gt;</text>
  <line x1="492" y1="490" x2="612" y2="490" stroke="#cbd5e1" />
  <text x="552" y="510" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="11.5">15/20 rutas activas</text>
  <text x="552" y="526" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="11">5 rutas sin vista UI</text>

  <!-- COLUMNA 2: BACKEND FASTAPI -->
  <rect x="650" y="118" width="376" height="614" rx="14" fill="#ffffff" stroke="#b9c6dc" stroke-width="2" />
  <rect x="650" y="118" width="376" height="52" rx="14" fill="#182338" />
  <text x="670" y="148" fill="#74d4e5" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="16" font-weight="700">2. CAPA BACKEND (API REST)</text>
  <text x="670" y="192" fill="#475569" font-family="JetBrains Mono, monospace" font-size="12">Python 3.12.1 · FastAPI · Uvicorn · Docker Compose</text>

  <!-- CORS + Main -->
  <rect x="670" y="210" width="336" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8" />
  <text x="684" y="236" fill="#0f172a" font-family="Inter, sans-serif" font-size="14.5" font-weight="700">app/main.py + CORSMiddleware</text>
  <text x="684" y="256" fill="#334155" font-family="Inter, sans-serif" font-size="12">Raíz GET / + Orígenes locales (puertos 5500 y 5501).</text>
  <text x="684" y="274" fill="#334155" font-family="Inter, sans-serif" font-size="12">Inicialización automática de tablas al arranque.</text>

  <!-- Router Auth -->
  <rect x="670" y="304" width="336" height="114" rx="10" fill="#f8fafc" stroke="#86efac" stroke-width="2" />
  <text x="684" y="330" fill="#0f172a" font-family="Inter, sans-serif" font-size="14.5" font-weight="700">Router /auth (4 endpoints)</text>
  <text x="684" y="352" fill="#334155" font-family="Inter, sans-serif" font-size="12">POST /login · GET /verify · DELETE /logout</text>
  <text x="684" y="370" fill="#475569" font-family="Inter, sans-serif" font-size="12">PUT /update-password (implementado, sin UI actual)</text>
  <text x="684" y="392" fill="#14532d" font-family="JetBrains Mono, monospace" font-size="11.5">JWT HS256 (Python-JOSE) + Hash Bcrypt (Passlib)</text>

  <!-- Routers CRUD -->
  <rect x="670" y="434" width="336" height="142" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="2" />
  <text x="684" y="460" fill="#0f172a" font-family="Inter, sans-serif" font-size="14.5" font-weight="700">Routers CRUD (15 endpoints: 5 × 3)</text>
  <text x="684" y="482" fill="#334155" font-family="Inter, sans-serif" font-size="12">/users · /services · /products (POST, GET, GET/{id}, PUT, DELETE)</text>
  <text x="684" y="502" fill="#334155" font-family="Inter, sans-serif" font-size="12">Validación de entrada y respuesta con Pydantic v2.</text>
  <rect x="684" y="516" width="308" height="46" rx="6" fill="#fef3c7" />
  <text x="694" y="535" fill="#78350f" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">Limitación auditada documentada:</text>
  <text x="694" y="552" fill="#78350f" font-family="Inter, sans-serif" font-size="11.5">Routers CRUD aún no exigen Depends(get_current_user).</text>

  <!-- SQLAlchemy ORM -->
  <rect x="670" y="592" width="336" height="114" rx="10" fill="#e0ecff" stroke="#2554dc" stroke-width="2" />
  <text x="684" y="620" fill="#1e3a8a" font-family="Inter, sans-serif" font-size="14.5" font-weight="700">SQLAlchemy 2.0 ORM (Sesión get_db)</text>
  <text x="684" y="644" fill="#1e293b" font-family="Inter, sans-serif" font-size="12.5">Modelos declarativos: User, Service y Product.</text>
  <text x="684" y="664" fill="#1e293b" font-family="Inter, sans-serif" font-size="12.5">Operaciones mediante ORM (sin SQL crudo manual).</text>
  <text x="684" y="684" fill="#475569" font-family="JetBrains Mono, monospace" font-size="11.5">check_same_thread=False</text>

  <!-- COLUMNA 3: PERSISTENCIA -->
  <rect x="1054" y="118" width="202" height="614" rx="14" fill="#ffffff" stroke="#b9c6dc" stroke-width="2" />
  <rect x="1054" y="118" width="202" height="52" rx="14" fill="#182338" />
  <text x="1072" y="148" fill="#74d4e5" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="16" font-weight="700">3. DATOS</text>

  <rect x="1072" y="560" width="166" height="146" rx="12" fill="#f8fafc" stroke="#0e7490" stroke-width="2" />
  <ellipse cx="1155" cy="590" rx="56" ry="16" fill="#cffafe" stroke="#0e7490" stroke-width="2" />
  <path d="M1099 590 v36 c0 9 25 16 56 16 s56 -7 56 -16 v-36" fill="#ecfeff" stroke="#0e7490" stroke-width="2" />
  <text x="1155" y="618" text-anchor="middle" fill="#0f172a" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="700">SQLite</text>
  <text x="1155" y="664" text-anchor="middle" fill="#334155" font-family="JetBrains Mono, monospace" font-size="11.5">data/smartcut.db</text>
  <text x="1155" y="684" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="11.5">Volumen Docker</text>
  <text x="1155" y="700" text-anchor="middle" fill="#0e7490" font-family="JetBrains Mono, monospace" font-size="11">./data:/app/data</text>

  <!-- Nota informativa en columna Datos -->
  <rect x="1072" y="210" width="166" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="1084" y="236" fill="#0f172a" font-family="Inter, sans-serif" font-size="13" font-weight="700">Tablas persistidas</text>
  <text x="1084" y="262" fill="#334155" font-family="JetBrains Mono, monospace" font-size="12">• users</text>
  <text x="1084" y="286" fill="#334155" font-family="JetBrains Mono, monospace" font-size="12">• services</text>
  <text x="1084" y="310" fill="#334155" font-family="JetBrains Mono, monospace" font-size="12">• products</text>
  <line x1="1084" y1="328" x2="1226" y2="328" stroke="#cbd5e1" />
  <text x="1084" y="348" fill="#475569" font-family="Inter, sans-serif" font-size="11.5">Sin tabla de citas</text>
  <text x="1084" y="366" fill="#475569" font-family="Inter, sans-serif" font-size="11.5">en versión actual</text>
  <text x="1084" y="384" fill="#475569" font-family="Inter, sans-serif" font-size="11.5">del prototipo.</text>

  <!-- FLECHAS DE CONEXIÓN -->
  <!-- AuthUI / CRUDUI -> ApiClient -->
  <line x1="239" y1="302" x2="239" y2="314" stroke="#2554dc" stroke-width="2" />
  <line x1="239" y1="408" x2="239" y2="420" stroke="#2554dc" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Agendamiento -> ApiClient (GET /services/) -->
  <path d="M 420 584 L 444 584 L 444 476 L 436 476" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowTeal)" />

  <!-- ApiClient <-> Canal API REST <-> Backend -->
  <line x1="434" y1="462" x2="474" y2="462" stroke="#2554dc" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <line x1="628" y1="462" x2="668" y2="462" stroke="#2554dc" stroke-width="2.5" marker-end="url(#arrowBlue)" />

  <!-- Routers -> ORM -->
  <line x1="838" y1="418" x2="838" y2="432" stroke="#2554dc" stroke-width="2" />
  <line x1="838" y1="576" x2="838" y2="590" stroke="#2554dc" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- ORM -> SQLite -->
  <line x1="1006" y1="646" x2="1070" y2="646" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrowTeal)" />
</svg>

